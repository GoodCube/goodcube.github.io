name: deploy to github pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: inject telegram token into config.js
        run: |
          echo "const BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}';" > assets/js/config.js
          echo "const ADMIN_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}';" >> assets/js/config.js

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4