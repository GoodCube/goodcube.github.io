<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodCube - Личный кабинет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .text-gradient { background: linear-gradient(135deg, #f97316, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-tab { transition: all 0.2s ease; cursor: pointer; }
        .auth-tab.active { border-bottom: 2px solid #f97316; color: #f97316; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    </style>
</head>
<body>

<nav class="fixed w-full z-50 glass border-b border-orange-900/30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-700 rounded-lg flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:shadow-orange-500/50 transition-all">
                        <i data-lucide="box" class="w-6 h-6 text-white"></i>
                    </div>
                    <span class="text-2xl font-bold text-gradient">GoodCube</span>
                </a>
            </div>

            <div class="hidden md:flex items-center gap-8">
                <a href="index.html" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Главная</a>
                <a href="#donate" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Донат</a>
                <a href="titles.html" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Титулы</a>
                <a href="constructor.html" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Конструктор</a>
                <a href="account.html" class="text-orange-400 font-semibold border-b-2 border-orange-500">Кабинет</a>
                <a href="commits.html" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Commits</a>
                <a href="rules.html" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Правила</a>
                <a href="launcher.html" class="text-gray-300 hover:text-orange-400 transition-colors font-medium">Лаунчер</a>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="openCurrencyModal()" class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-white px-6 py-2 rounded-full font-semibold transition-all hover:shadow-lg hover:shadow-yellow-500/40 flex items-center gap-2">
                    <i data-lucide="coins" class="w-4 h-4"></i>
                    Купить валюту
                </button>
                <button class="mobile-menu-btn md:hidden w-10 h-10 rounded-full glass flex items-center justify-center" onclick="toggleMobileMenu()">
                    <i data-lucide="menu" class="w-5 h-5 text-white"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<section class="pt-32 pb-20 px-4">
    <div class="max-w-md mx-auto">
        <!-- Неавторизованный блок -->
        <div id="unauthorizedState">
            <div class="glass rounded-2xl p-8">
                <div class="flex border-b border-gray-700 mb-6">
                    <div onclick="switchTab('login')" id="loginTab" class="auth-tab active flex-1 text-center py-2 font-semibold">Вход</div>
                    <div onclick="switchTab('register')" id="registerTab" class="auth-tab flex-1 text-center py-2 font-semibold text-gray-400">Регистрация</div>
                </div>

                <!-- Форма входа -->
                <div id="loginForm">
                    <input type="text" id="loginUsername" placeholder="Логин или Email" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 mb-3 text-white">
                    <input type="password" id="loginPassword" placeholder="Пароль" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 mb-4 text-white">
                    <button onclick="loginWithPassword()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 rounded-lg font-semibold">Войти</button>
                </div>

                <!-- Форма регистрации -->
                <div id="registerForm" style="display:none">
                    <input type="text" id="regUsername" placeholder="Логин" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 mb-3 text-white">
                    <input type="email" id="regEmail" placeholder="Email" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 mb-3 text-white">
                    <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 mb-4 text-white">
                    <button onclick="registerWithPassword()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 rounded-lg font-semibold">Зарегистрироваться</button>
                </div>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-700"></div></div>
                    <div class="relative flex justify-center text-xs"><span class="bg-gray-900 px-2 text-gray-400">Или</span></div>
                </div>

                <button onclick="loginWithGoogle()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-semibold flex items-center justify-center gap-2 mb-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google (Бета!)
                </button>

                <button onclick="loginWithTelegram()" class="w-full bg-[#0088cc] hover:bg-[#0088cc]/80 text-white py-2 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i>
                    Telegram (Бета!)
                </button>
            </div>
        </div>

        <!-- Авторизованный блок -->
        <div id="authorizedState" class="hidden glass rounded-2xl p-8 text-center">
            <div class="avatar w-20 h-20 rounded-full bg-gradient-to-br from-orange-500 to-orange-700 flex items-center justify-center mx-auto mb-4 text-3xl font-bold" id="userAvatar">G</div>
            <h2 class="text-xl font-bold" id="userName">Игрок</h2>
            <p class="text-gray-400 text-sm" id="userEmail"></p>
            <p class="text-orange-400 text-sm mt-1" id="userMinecraft"></p>
            <button onclick="logout()" class="mt-6 glass px-4 py-2 rounded-lg text-sm">Выйти</button>
        </div>
    </div>
</section>

<canvas id="particles"></canvas>

<script>
    const API_URL = 'https://api.goodcube.site/auth';

    // ========== Вкладки ==========
    function switchTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('loginTab').classList.toggle('active', tab === 'login');
        document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    }

    // ========== Логин/Пароль ==========
    async function loginWithPassword() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        const res = await fetch(`${API_URL}/login.php`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
            checkAuth();
        } else {
            alert(data.error);
        }
    }

    async function registerWithPassword() {
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        const res = await fetch(`${API_URL}/register.php`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (data.success) {
            checkAuth();
        } else {
            alert(data.error);
        }
    }

    // ========== Google ==========
    function loginWithGoogle() {
        window.location.href = `${API_URL}/google-login.php`;
    }

    // ========== Telegram ==========
    function loginWithTelegram() {
        // Telegram Login Widget
        const script = document.createElement('script');
        script.src = 'https://telegram.org/js/telegram-widget.js?22';
        script.setAttribute('data-telegram-login', 'goodcube_auth_bot');
        script.setAttribute('data-size', 'large');
        script.setAttribute('data-radius', '12');
        script.setAttribute('data-request-access', 'write');
        script.setAttribute('data-auth-url', `${API_URL}/tg-login.php`);
        script.setAttribute('data-userpic', 'true');

        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50';
        modal.onclick = () => modal.remove();
        const container = document.createElement('div');
        container.className = 'glass rounded-2xl p-8 text-center';
        container.onclick = (e) => e.stopPropagation();
        container.innerHTML = '<h3 class="text-xl font-bold mb-4">Вход через Telegram</h3><div id="telegramWidget"></div><button onclick="this.closest(\'.fixed\').remove()" class="mt-4 text-gray-400 text-sm">Закрыть</button>';
        modal.appendChild(container);
        document.body.appendChild(modal);

        const widgetContainer = container.querySelector('#telegramWidget');
        const widgetScript = document.createElement('script');
        widgetScript.src = 'https://telegram.org/js/telegram-widget.js?22';
        widgetScript.setAttribute('data-telegram-login', 'goodcube_auth_bot');
        widgetScript.setAttribute('data-size', 'large');
        widgetScript.setAttribute('data-radius', '12');
        widgetScript.setAttribute('data-request-access', 'write');
        widgetScript.setAttribute('data-auth-url', `${API_URL}/tg-login.php`);
        widgetScript.setAttribute('data-userpic', 'true');
        widgetContainer.appendChild(widgetScript);
    }

    // ========== Выход ==========
    function logout() {
        window.location.href = `${API_URL}/logout.php`;
    }

    // ========== Проверка статуса ==========
    async function checkAuth() {
        try {
            const res = await fetch(`${API_URL}/status.php`, { credentials: 'include' });
            const data = await res.json();

            if (data.logged_in) {
                document.getElementById('unauthorizedState').style.display = 'none';
                document.getElementById('authorizedState').style.display = 'block';
                document.getElementById('userName').textContent = data.username;
                document.getElementById('userEmail').textContent = data.email || 'Нет email';
                if (data.avatar) {
                    document.getElementById('userAvatar').innerHTML = `<img src="${data.avatar}" class="w-full h-full rounded-full object-cover">`;
                }
                if (data.minecraft_nick) {
                    document.getElementById('userMinecraft').innerHTML = `🎮 ${data.minecraft_nick}`;
                }
            } else {
                document.getElementById('unauthorizedState').style.display = 'block';
                document.getElementById('authorizedState').style.display = 'none';
            }
        } catch(e) {
            console.error('Auth check failed:', e);
        }
    }

    // ========== Telegram Bot Name ==========
    // Создай бота через @BotFather: goodcube_auth_bot
    // Добавь домен в BotFather: /setdomain → https://api.goodcube.site

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        lucide.createIcons();
    });

    // Частицы
    (function() {
        const c = document.getElementById('particles');
        if (!c) return;
        const ctx = c.getContext('2d');
        let p = [];
        function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
        function init() {
            p = [];
            for (let i = 0; i < 80; i++) {
                p.push({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 2 + 1, dx: (Math.random() - 0.5) * 0.8, dy: (Math.random() - 0.5) * 0.8 });
            }
        }
        function draw() {
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = '#f97316';
            for (let i of p) {
                ctx.beginPath();
                ctx.arc(i.x, i.y, i.r, 0, Math.PI * 2);
                ctx.fill();
                i.x += i.dx;
                i.y += i.dy;
                if (i.x < 0 || i.x > c.width) i.dx *= -1;
                if (i.y < 0 || i.y > c.height) i.dy *= -1;
            }
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', () => { resize(); init(); });
        resize();
        init();
        draw();
    })();
</script>
</body>
</html>
